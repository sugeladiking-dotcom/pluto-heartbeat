<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {AfterimagePass} from 'three/addons/postprocessing/AfterimagePass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';

/* =========================================================
   基础工具
   ========================================================= */
const D2R=Math.PI/180;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const io=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const eo=u=>1-Math.pow(1-u,3);
const sstep=(a,b,x)=>{const u=clamp((x-a)/(b-a));return u*u*(3-2*u)};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const add=(a,x,y,z)=>V(a.x+x,a.y+y,a.z+z);
const vl=(a,b,u)=>a.clone().lerp(b,u);
// 方位：az=0 指向 +X（心形所在一侧，正对卡戎），az=90 指向 -Z；el 向上
const sph=(c,r,az,el)=>{az*=D2R;el*=D2R;return V(c.x+r*Math.cos(el)*Math.cos(az),c.y+r*Math.sin(el),c.z-r*Math.cos(el)*Math.sin(az))};
let rs=7;const rnd=()=>{rs=(rs*16807)%2147483647;return (rs-1)/2147483646};

// 系统布局（共转参照系）：质心在原点，两者沿 X 轴相望
const O=V(0,0,0), PL=V(-0.76,0,0), CH=V(6.24,0,0), MID=V(2.74,0,0);
const R_CH=0.52;

/* =========================================================
   GLSL 片段
   ========================================================= */
const NOISE=`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.5-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;
  return 105.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm3(vec3 p){float s=0.,a=.5;for(int i=0;i<3;i++){s+=a*snoise(p);p=p*2.07+vec3(3.1,1.7,5.3);a*=.5;}return s;}
float fbm5(vec3 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*snoise(p);p=p*2.03+vec3(3.1,1.7,5.3);a*=.5;}return s;}
float fbm7(vec3 p){float s=0.,a=.5;for(int i=0;i<7;i++){s+=a*snoise(p);p=p*2.01+vec3(3.1,1.7,5.3);a*=.5;}return s;}
vec3 hash33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
vec2 voro(vec3 x){vec3 p=floor(x);vec3 f=fract(x);float d1=8.,d2=8.;
  for(int k=-1;k<=1;k++)for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){
    vec3 b=vec3(float(i),float(j),float(k));vec3 r=b-f+hash33(p+b);float d=dot(r,r);
    if(d<d1){d2=d1;d1=d;}else if(d<d2){d2=d;}}
  return vec2(sqrt(d1),sqrt(d2));}
`;
const HEART=`
float dot2(vec2 v){return dot(v,v);}
float sdHeart(vec2 p){p.x=abs(p.x);
  if(p.y+p.x>1.0)return sqrt(dot2(p-vec2(0.25,0.75)))-sqrt(2.0)/4.0;
  return sqrt(min(dot2(p-vec2(0.0,1.0)),dot2(p-0.5*max(p.x+p.y,0.0))))*sign(p.x-p.y);}
float heartSD(vec3 n){
  vec2 p=vec2(-n.z,n.y)/(1.0+max(n.x,-0.9));
  p*=2.05;
  p+=0.06*vec2(snoise(n*5.0),snoise(n*5.0+11.0))+0.022*vec2(snoise(n*15.0+3.0),snoise(n*15.0+21.0));
  p.y+=0.52;
  p.x*=(p.x<0.0)?0.92:1.05;
  return sdHeart(p);
}
`;
const PLANET_VS=`
varying vec3 vObj;varying vec3 vWorld;
void main(){vObj=position;vec4 w=modelMatrix*vec4(position,1.0);vWorld=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;

/* ---------- 冥王星 ---------- */
const PLUTO_FS=`
uniform vec3 uSunDir,uSunCol,uAmbCol;uniform float uSunInt,uTime,uHeart,uBeat,uRipR,uRipA;uniform mat3 uRot;
varying vec3 vObj;varying vec3 vWorld;
${NOISE}${HEART}
float hgt(vec3 n,float hin,float left){
  float h=fbm5(n*5.0)*0.55+fbm3(n*21.0)*0.22;
  float rg=1.0-abs(snoise(n*9.0));h+=rg*rg*0.25*(1.0-hin);
  if(hin*left>0.02){vec2 v=voro(n*15.0);float cells=smoothstep(0.0,0.3,v.y-v.x);
    h=mix(h,0.035*cells+0.015*snoise(n*80.0)+0.03*fbm3(n*30.0),hin*left);}
  else{h=mix(h,h*0.35+0.05*snoise(n*60.0),hin);}
  return h;}
void main(){
  vec3 n=normalize(vObj);
  float sd=heartSD(n);
  float front=smoothstep(-0.05,0.3,n.x);
  float hin=smoothstep(0.03,-0.03,sd)*front;
  float left=smoothstep(-0.05,0.08,n.z);
  vec3 t1=normalize(cross(n,normalize(vec3(0.3,0.9,0.31))));vec3 t2=cross(n,t1);
  float e=0.0022;
  float h0=hgt(n,hin,left),h1=hgt(normalize(n+t1*e),hin,left),h2=hgt(normalize(n+t2*e),hin,left);
  vec3 nb=normalize(n-0.03*((h1-h0)*t1+(h2-h0)*t2)/e);
  // 反照率：红褐色托林 + 克苏鲁暗带 + 极冠 + 心形氮冰
  float hc=fbm5(n*2.4+vec3(4.0));float hd=fbm3(n*10.0);
  vec3 alb=mix(vec3(0.36,0.13,0.06),vec3(0.80,0.52,0.34),smoothstep(-0.4,0.5,hc+0.3*hd));
  float belt=smoothstep(0.36,0.1,abs(n.y+0.06+0.15*hc))*smoothstep(0.55,-0.05,n.x+0.25*hc);
  alb=mix(alb,vec3(0.14,0.045,0.03)*(0.8+0.4*hd),belt*0.9);
  float pole=smoothstep(0.55,0.85,n.y+0.12*hc);
  alb=mix(alb,vec3(0.86,0.78,0.64),pole*0.8);
  vec3 ice=mix(vec3(0.90,0.86,0.86),vec3(0.99,0.97,0.98),0.5+0.5*fbm3(n*7.0));
  ice=mix(ice,ice*vec3(1.0,0.93,0.9),(1.0-left)*0.6);
  float frost=smoothstep(0.16,0.0,sd)*smoothstep(0.0,0.5,fbm3(n*14.0)+0.2)*front;
  float iceAmt=max(hin,frost*0.7);
  alb=mix(alb,ice*0.92,iceAmt);
  if(hin*left>0.02){vec2 v=voro(n*15.0);float edge=1.0-smoothstep(0.0,0.05,v.y-v.x);alb*=1.0-0.06*edge*hin*left;}
  iceAmt=max(iceAmt,pole*0.5);
  // 光照
  vec3 N=normalize(uRot*nb);vec3 Ng=normalize(uRot*n);
  vec3 Vv=normalize(cameraPosition-vWorld);vec3 L=normalize(uSunDir);
  float ndl=dot(N,L);float ndlG=dot(Ng,L);
  float lit=clamp(ndl,0.0,1.0)*smoothstep(-0.06,0.12,ndlG);
  vec3 col=alb*uSunCol*uSunInt*lit*0.95;
  vec3 H=normalize(L+Vv);float nh=max(dot(N,H),0.0);
  float sp=pow(nh,60.0)*0.4*iceAmt*lit;
  float gl=smoothstep(0.72,0.95,snoise(n*900.0+Vv*3.0))*iceAmt*lit*pow(nh,6.0);
  col+=uSunCol*uSunInt*(sp+gl*2.5);
  col+=vec3(0.25,0.42,0.95)*0.32*exp(-pow((ndlG+0.03)/0.10,2.0))*uSunInt*(0.4+alb);
  col+=alb*uAmbCol*(0.55+0.45*Ng.y);
  float fr=pow(1.0-max(dot(Ng,Vv),0.0),4.0);
  col+=vec3(0.3,0.5,1.0)*fr*0.35*max(ndlG+0.35,0.0)*uSunInt;
  // 冰层下的心跳
  float ang=acos(clamp(n.x,-1.0,1.0));
  float veins=pow(1.0-abs(snoise(n*6.0+vec3(0.0,uTime*0.08,0.0))),6.0)+0.6*pow(1.0-abs(snoise(n*13.0-vec3(uTime*0.05))),8.0);
  float core=hin*(0.35+0.65*smoothstep(0.0,-0.25,sd));
  vec3 gcol=mix(vec3(1.0,0.26,0.40),vec3(1.0,0.72,0.50),clamp(veins*0.6,0.0,1.0));
  float pulse=0.35+1.5*uBeat;
  vec3 emit=gcol*uHeart*core*(0.12+veins*0.75)*pulse*0.62;
  float ring=exp(-pow((ang-uRipR)/0.035,2.0))*uRipA;
  emit+=vec3(1.0,0.48,0.55)*ring*uHeart*0.9*(0.35+hin);
  emit*=mix(1.0,0.3,lit);
  col+=emit;
  gl_FragColor=vec4(col,1.0);
}`;

/* ---------- 卡戎 ---------- */
const CHARON_FS=`
uniform vec3 uSunDir,uSunCol,uAmbCol;uniform float uSunInt,uTide;uniform mat3 uRot;
varying vec3 vObj;varying vec3 vWorld;
${NOISE}
float hgtC(vec3 n){
  float h=fbm5(n*4.0)*0.5+fbm3(n*18.0)*0.2;
  vec2 v=voro(n*6.0);float cr=v.x;
  float gate=smoothstep(-0.3,0.2,snoise(n*2.7+7.0));
  h+=(-smoothstep(0.34,0.0,cr)*0.6+exp(-pow((cr-0.36)/0.05,2.0))*0.28)*gate;
  vec2 v2=voro(n*15.0);h+=(-smoothstep(0.3,0.0,v2.x)*0.25)*smoothstep(0.1,0.5,snoise(n*5.0));
  float chs=exp(-pow((n.y-0.08-0.06*snoise(n*2.5))/0.03,2.0))*smoothstep(-0.2,0.4,n.z);
  return h-chs*0.6;}
void main(){
  vec3 n=normalize(vObj);
  vec3 t1=normalize(cross(n,normalize(vec3(0.3,0.9,0.31))));vec3 t2=cross(n,t1);
  float e=0.003;float h0=hgtC(n),h1=hgtC(normalize(n+t1*e)),h2=hgtC(normalize(n+t2*e));
  vec3 nb=normalize(n-0.05*((h1-h0)*t1+(h2-h0)*t2)/e);
  float m=fbm5(n*3.0);
  vec3 alb=mix(vec3(0.36,0.35,0.34),vec3(0.64,0.62,0.60),smoothstep(-0.4,0.5,m));
  float cap=smoothstep(0.6,0.86,n.y+0.1*fbm3(n*5.0));
  alb=mix(alb,vec3(0.38,0.15,0.08),cap*0.85);
  vec3 N=normalize(uRot*nb);vec3 Ng=normalize(uRot*n);
  vec3 Vv=normalize(cameraPosition-vWorld);vec3 L=normalize(uSunDir);
  float lit=clamp(dot(N,L),0.0,1.0)*smoothstep(-0.05,0.1,dot(Ng,L));
  vec3 col=alb*uSunCol*uSunInt*lit*0.95+alb*uAmbCol*(0.55+0.45*Ng.y);
  float fr=pow(1.0-max(dot(Ng,Vv),0.0),3.0);
  col+=vec3(1.0,0.45,0.55)*uTide*(pow(max(-n.x,0.0),2.0)*0.5+fr*1.6);
  gl_FragColor=vec4(col,1.0);
}`;

/* ---------- 冥王星蓝色高层霾 ---------- */
const ATM_VS=`varying vec3 vWorld;void main(){vec4 w=modelMatrix*vec4(position,1.0);vWorld=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;
const ATM_FS=`
uniform vec3 uCenter,uSunDir;uniform float uAtm,uSunInt;varying vec3 vWorld;
void main(){
  vec3 ro=cameraPosition-uCenter;vec3 rd=normalize(vWorld-cameraPosition);
  float tca=-dot(ro,rd);vec3 pc=ro+rd*tca;float b=length(pc);float alt=b-1.0;vec3 up0=normalize(pc);
  float dens;
  if(alt>0.0){dens=exp(-alt/0.024)*(0.85+0.15*sin(alt*480.0+sin(dot(up0,vec3(9.0,7.0,5.0)))*2.0))+0.25*exp(-alt/0.07);}
  else{dens=0.015+0.985*pow(b,22.0);}
  vec3 L=normalize(uSunDir);vec3 up=normalize(pc);
  float lit=smoothstep(-0.4,0.45,dot(up,L));
  float fwd=pow(max(dot(rd,L),0.0),5.0);
  float limb=alt>0.0?1.0:pow(b,22.0);
  vec3 c=vec3(0.30,0.55,1.0)*(0.35*lit+2.4*fwd*limb)*dens;

}`;

/* ---------- 天空：烘焙后的星云场 ---------- */
const BAKE_FS=`
varying vec3 vDir;${NOISE}
void main(){vec3 d=normalize(vDir);
  vec3 axis=normalize(vec3(0.3,1.0,0.2));
  float band=exp(-pow(dot(d,axis)/0.34,2.0));
  vec3 q=d*1.7+0.7*vec3(fbm5(d*2.0),fbm5(d*2.0+5.2),fbm5(d*2.0+9.1));
  float a=smoothstep(-0.15,0.75,fbm7(q*1.5));
  float b=smoothstep(0.0,0.85,fbm7(q*2.7+3.3));
  float r=1.0-abs(fbm5(d*5.0+q*1.3));
  float dust=smoothstep(0.55,0.95,r)*smoothstep(-0.1,0.4,fbm5(d*3.0+2.0));
  gl_FragColor=vec4(a,b,dust,band);}`;
const SKY_VS=`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const SKY_FS=`
uniform samplerCube uField;uniform vec3 uSunDir;uniform float uNeb,uWarm;uniform mat3 uSkyInv;varying vec3 vDir;
void main(){vec3 d=normalize(vDir);vec4 f=textureCube(uField,d);
  float w=uWarm*0.5+0.5;
  vec3 base=mix(vec3(0.012,0.010,0.034),vec3(0.022,0.010,0.030),w);
  vec3 rose=mix(vec3(0.40,0.13,0.48),vec3(0.92,0.34,0.30),w);
  vec3 teal=mix(vec3(0.06,0.30,0.58),vec3(0.36,0.20,0.56),w);
  vec3 c=base+rose*f.r*(0.25+0.75*f.a)*0.5+teal*f.g*(0.3+0.7*f.a)*0.34;
  c+=vec3(0.95,0.85,0.8)*f.a*0.05*(0.4+f.r);
  c*=1.0-0.78*f.b*(0.3+0.7*f.a);
  vec3 sd=normalize(uSkyInv*uSunDir);float s=max(dot(d,sd),0.0);
  c+=vec3(1.0,0.6,0.38)*pow(s,6.0)*0.22+vec3(1.0,0.78,0.55)*pow(s,60.0)*0.5;
  gl_FragColor=vec4(c*uNeb,1.0);}`;

/* ---------- 星星 ---------- */
const STAR_VS=`attribute float aSize,aPhase;attribute vec3 aColor;uniform float uTime,uPR,uStars;varying vec3 vC;
void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;
  float tw=0.72+0.28*sin(uTime*(0.8+aPhase*3.0)+aPhase*40.0);
  gl_PointSize=aSize*uPR*(0.85+0.15*tw);vC=aColor*uStars*tw;}`;
const STAR_FS=`varying vec3 vC;void main(){vec2 p=gl_PointCoord*2.0-1.0;float r=dot(p,p);
  float a=exp(-r*5.0)*0.6+exp(-r*28.0)*1.6;gl_FragColor=vec4(vC*a,1.0);}`;

/* ---------- 太阳（远处一颗极亮的星） ---------- */
const BB_VS=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const SUN_FS=`uniform float uInt,uVis,uTime;uniform vec3 uCol;varying vec2 vUv;
void main(){vec2 p=vUv*2.0-1.0;float r=length(p);
  float core=exp(-r*r*1400.0)*14.0+exp(-r*70.0)*1.4+exp(-r*12.0)*0.28+exp(-r*3.8)*0.07;
  float a=atan(p.y,p.x);
  float spikes=(pow(abs(cos(a*3.0+0.35)),90.0)*0.9+pow(abs(cos(a*2.0+1.2)),160.0)*0.5)*exp(-r*6.0);
  float streak=exp(-abs(p.y)*150.0)*exp(-abs(p.x)*2.4)*0.6;
  vec3 c=uCol*(core+spikes)+vec3(0.6,0.75,1.0)*streak;
  gl_FragColor=vec4(c*uInt*uVis*smoothstep(1.0,0.75,r),1.0);}`;

/* ---------- 心形冰原取样（给粒子用） ---------- */
function sdHeartJS(x,y){x=Math.abs(x);if(y+x>1)return Math.hypot(x-0.25,y-0.75)-Math.SQRT2/4;
  const m=0.5*Math.max(x+y,0);return Math.sqrt(Math.min(x*x+(y-1)**2,(x-m)**2+(y-m)**2))*Math.sign(x-y);}
function heartDir(){for(;;){const x=(rnd()*2-1)*0.75,y=rnd()*1.15-0.05;if(sdHeartJS(x,y)<-0.03){
  const qx=x/(x<0?0.92:1.05)/2.05,qy=(y-0.52)/2.05;const s=qx*qx+qy*qy;return V((1-s)/(1+s),2*qy/(1+s),-2*qx/(1+s));}}}

  const m=new THREE.ShaderMaterial(addMat({uniforms:dustU,fragmentShader:SOFT_FS,vertexShader:`

function shotParams(sh,u,t){const o={...DEF};for(const k in sh.P){const v=sh.P[k];o[k]=typeof v==='function'?v(u,t):v}return o}
function shotCam(sh,u,t,spin){const c=sh.cam(u,t);const out={p:c.p.clone(),t:c.t.clone(),fov:c.fov,up:c.up||V(0,1,0)};
  if((sh.frame||'sys')==='sys'&&spin){const a=spin*D2R;out.p.applyAxisAngle(V(0,1,0),a);out.t.applyAxisAngle(V(0,1,0),a)}return out}
function segAt(t){for(let i=SEG.length-1;i>=0;i--)if(t>=SEG[i].start)return i;return 0}
function evalState(t){
  const i=segAt(Math.min(t,TOTAL-1e-3));const seg=SEG[i];const sh=SH[seg.shot];const lt=t-seg.start;const u=clamp(lt/seg.dur);
  const P=shotParams(sh,u,t);let cam=shotCam(sh,u,t,P.spin);
  if(i>0&&lt<1.0){const ps=SEG[i-1],psh=SH[ps.shot];const PP=shotParams(psh,1,t);const w=sstep(0,1,lt/0.9);
    if(sh.blend){for(const k in P)if(typeof P[k]==='number')P[k]=lerp(PP[k],P[k],w);
      const pc=shotCam(psh,1,t,PP.spin);cam.p.lerp(pc.p,1-w);cam.t.lerp(pc.t,1-w);cam.fov=lerp(pc.fov,cam.fov,w)}
    else for(const k of SMOOTH)P[k]=lerp(PP[k],P[k],w)}
  return {seg,sh,u,P,cam,scene:sh.scene||'main'};
}

   n.connect(bp);bp.connect(g);g.connect(this.bus);n.start(t0,Math.random());n.stop(t0+dur+0.4)},
 bar(k,tb,skip){const b=BARS[k];const A=AUD[b.aud];const fd=b.fade;const st=Math.max(0,skip);
   const ok=x=>x>=skip-0.02;
   const pad=vc(PC[b.ch].slice(0,3),55).concat(vc([PC[b.ch][3]],67));
   pad.forEach(m=>this.pad(tb+st,BAR-st+0.1,m,A.pad*0.03*fd,A.cut));
   if(A.sh)this.shimmer(tb+st,BAR-st,A.sh*0.012*fd);
   const ar=vc(PC[b.ch],74);
   const pat=A.arp==='8'?[0,2,1,3,2,1,3,2].map((n,i)=>[i*0.375,n]):A.arp==='q'?[0,1,2,3].map((n,i)=>[i*0.75,n]):[[0,3],[1.5,1]];
   pat.forEach(([x,n],i)=>{if(ok(x))this.bell(tb+x,ar[n%ar.length]+((A.arp==='sparse'&&i===0)?12:0),A.arpV*fd*(i%2?0.75:1))});
   if(A.spark){for(let i=0;i<8;i++){if(hsh(k*8+i)>0.8&&ok(i*0.375+0.19)){const pent=[86,88,90,93,95,98];this.bell(tb+i*0.375+0.19,pent[Math.floor(hsh(k*31+i)*6)],0.022*fd)}}}
   if(A.hb){for(const x of [0,1.5]){if(ok(x))this.thump(tb+x,0.55*A.hb*fd);if(ok(x+0.27))this.thump(tb+x+0.27,0.36*A.hb*fd)}}
   if(A.bass){const r=vc([ROOT[b.ch]],36)[0];if(ok(0))this.bass(tb,1.4,r,A.bass*0.16);if(ok(1.5))this.bass(tb+1.5,1.4,r+(A.arp==='8'?12:0),A.bass*0.12)}
   if(A.lead){const tones=vc(PC[b.ch],69);const mel=k%2?[[0,2,1.0],[1.125,1,0.35],[1.5,3,1.3]]:[[0,3,0.7],[0.75,2,0.7],[1.5,1,0.35],[1.875,0,1.0]];
     mel.forEach(([x,n,d])=>{if(ok(x))this.lead(tb+x,d,tones[n]+12,A.lead*0.05)})}
 },
 tick(now){if(!this.ok)return;while(this.next<BARS.length&&this.next*BAR<now+0.8){const k=this.next;const skip=now-k*BAR;
   this.bar(k,this.ctxStart+k*BAR,skip);this.next++}},
};

/* =========================================================
   播放控制
   ========================================================= */
const qs=new URLSearchParams(location.search);
const clock={playing:false,base:0,perf0:0,useAudio:false,
 now(){if(!this.playing)return this.base;if(this.useAudio&&score.ok)return score.ctx.currentTime-score.ctxStart;return this.base+(performance.now()-this.perf0)/1000},
 play(){if(this.base>=TOTAL-0.05)this.base=0;this.playing=true;this.perf0=performance.now();if(this.useAudio&&score.ok){score.ctx.resume();score.start(this.base)}lyricReset();ui.pp.textContent='❚❚'},
 pause(){this.base=this.now();this.playing=false;if(this.useAudio)score.stop();ui.pp.textContent='▶'},
 seek(t){t=clamp(t,0,TOTAL);const p=this.playing;if(p)this.pause();this.base=t;lyricReset();if(p)this.play()},
};
window.MV={seek:t=>clock.seek(t),play:()=>clock.play(),pause:()=>clock.pause(),get t(){return clock.now()},SEG,TOTAL};

const ui={pp:document.getElementById('pp'),tm:document.getElementById('tm'),sk:document.getElementById('sk'),mu:document.getElementById('mu'),fs:document.getElementById('fs'),ctl:document.getElementById('ctl'),
  lyric:document.getElementById('lyric'),sec:document.getElementById('sec'),hud:document.getElementById('hud'),counter:document.getElementById('counter'),cn:document.querySelector('#counter .n'),
  title:document.getElementById('title'),end:document.getElementById('endcard'),start:document.getElementById('start')};
ui.sk.max=TOTAL;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
document.getElementById('dur').textContent=fmt(TOTAL);
let started=false;
document.getElementById('go').onclick=()=>{score.init();clock.useAudio=score.ok;started=true;ui.start.classList.add('hide');clock.base=0;clock.play()};
ui.pp.onclick=()=>clock.playing?clock.pause():clock.play();
ui.sk.oninput=()=>clock.seek(+ui.sk.value);
ui.mu.onclick=()=>{score.muted=!score.muted;if(score.master)score.master.gain.value=score.muted?0:0.9;ui.mu.style.opacity=score.muted?0.35:0.85};
ui.fs.onclick=()=>{document.fullscreenElement?document.exitFullscreen().catch(()=>{}):document.documentElement.requestFullscreen?.().catch(()=>{})};
let hideT=0;addEventListener('mousemove',()=>{if(!started)return;ui.ctl.classList.add('show');clearTimeout(hideT);hideT=setTimeout(()=>ui.ctl.classList.remove('show'),2400)});
addEventListener('keydown',e=>{if(!started)return;if(e.code==='Space'){e.preventDefault();clock.playing?clock.pause():clock.play()}
  else if(e.code==='ArrowRight')clock.seek(clock.now()+5);else if(e.code==='ArrowLeft')clock.seek(clock.now()-5);
  else if(e.code==='KeyF')ui.fs.onclick();else if(e.code==='KeyM')ui.mu.onclick()});

/* 歌词 */
let curLyric=-1;
function lyricReset(){curLyric=-2}
function showLyric(seg,lt){
  const want=(seg.lyric&&lt>0.12&&lt<seg.dur-0.35)?seg.idx:-1;
  if(want===curLyric)return;
  const instant=curLyric===-2;curLyric=want;
  for(const r of [...ui.lyric.children]){if(instant){r.remove()}else{r.classList.add('out');setTimeout(()=>r.remove(),1200)}}
  if(want<0)return;
  const row=document.createElement('div');row.className='row';let i=0;
  for(const ch of seg.lyric){if(ch===' '){const g=document.createElement('span');g.className='gap';row.appendChild(g);i+=2;continue}
    const s=document.createElement('span');s.className='ch';s.textContent=ch;s.style.animationDelay=(instant?0:(i*0.07))+'s';if(instant)s.style.animationDuration='0.01s';row.appendChild(s);i++}
  ui.lyric.appendChild(row);
}

/* =========================================================
   每帧
   ========================================================= */
const tmpQ=new THREE.Quaternion(),tmpM4=new THREE.Matrix4(),tmpV=V(),skyAxis=V(0.3,1,0.2).normalize();
let afterWasOn=false;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);composer.setSize(w,h);camera.aspect=w/h;
  finalPass.uniforms.uRes.value.set(w*PR,h*PR);finalPass.uniforms.uAspect.value=w/h}
addEventListener('resize',resize);resize();

function occl(center,R){tmpV.copy(center).sub(camera.position);const d=tmpV.length();tmpV.divideScalar(d);const ca=tmpV.dot(sunDir);
  if(ca<=0||d<R)return 1;const th=Math.acos(Math.min(1,ca));const al=Math.asin(Math.min(R/d,1));return sstep(al*0.97,al*1.12,th)}
const sunDir=V(1,0,0);

function update(t){
  const S=evalState(t);const P=S.P;
  G.uTime.value=t;
  const hb=heartbeat(t);G.uBeat.value=hb.env*clamp(P.heart*1.1);
  pivot.rotation.y=P.spin*D2R;pivot.updateMatrixWorld(true);
  // 相机
  camera.position.copy(S.cam.p);camera.up.copy(S.cam.up);camera.lookAt(S.cam.t);
  const asp=innerWidth/innerHeight;let fov=S.cam.fov;if(asp<16/9){const k=Math.tan(fov*D2R/2)*(16/9)/asp;fov=lerp(fov,2*Math.atan(k)/D2R,asp<1?0.85:0.62)}
  camera.fov=Math.min(fov,110);camera.updateProjectionMatrix();camera.updateMatrixWorld(true);
  G.uPS.value=renderer.domElement.height/(2*Math.tan(camera.fov*D2R/2));
  // 太阳与天空
  sunDir.copy(sph(O,1,P.sunAz,P.sunEl)).normalize();
  const isOrr=S.scene==='orrery';
  tmpQ.setFromAxisAngle(skyAxis,P.starRot);
  for(const r of [skyRig,oskyRig])r.position.copy(camera.position);stars.quaternion.copy(tmpQ);
  skyMat.uniforms.uNeb.value=P.neb;skyMat.uniforms.uWarm.value=P.warm;starMat.uniforms.uStars.value=P.stars;
  const pPos=pluto.getWorldPosition(V()),cPos=charon.getWorldPosition(V());
  let sunVis=0;
  if(!isOrr){
    skyMat.uniforms.uSunDir.value.copy(sunDir);
    sun.position.copy(camera.position).addScaledVector(sunDir,1000);sun.quaternion.copy(camera.quaternion);sun.scale.setScalar(1000*0.5*P.sunSize);
    const vis=occl(pPos,1.0)*occl(cPos,R_CH);
    sun.material.uniforms.uVis.value=lerp(0.32,1,vis)*clamp(P.sunInt*1.2);
    tmpV.copy(camera.position).add(sunDir).project(camera);
    if(tmpV.z<1&&Math.abs(tmpV.x)<1.3&&Math.abs(tmpV.y)<1.3){finalPass.uniforms.uSunUV.value.set(tmpV.x*0.5+0.5,tmpV.y*0.5+0.5);sunVis=vis*clamp(P.sunInt)*sstep(1.3,0.9,Math.max(Math.abs(tmpV.x),Math.abs(tmpV.y)))}
  }else{
    skyMat.uniforms.uSunDir.value.set(0,-1,0);
    oSun.position.set(0,0,0);oSun.quaternion.copy(camera.quaternion);oSun.scale.setScalar(9);oSun.material.uniforms.uVis.value=1;
    const pp=plutoOrbitPos(P.plutoOrb);oPluto.position.copy(pp.v);plutoOrbit.material.uniforms.uHead.value=pp.e;plutoOrbit.material.uniforms.uTrail.value=1;
    const ea=P.earthLaps*Math.PI*2+0.6;oEarth.position.set(4*Math.cos(ea),0,-4*Math.sin(ea));
    earthOrbit.material.uniforms.uHead.value=((P.earthLaps+0.6/(Math.PI*2))%1+1)%1;earthOrbit.material.uniforms.uTrail.value=0.8;earthOrbit.material.uniforms.uBase.value=0.12+P.earthGlow*0.9;
    tmpV.set(0,0,0).project(camera);finalPass.uniforms.uSunUV.value.set(tmpV.x*0.5+0.5,tmpV.y*0.5+0.5);sunVis=0.5;
  }
  // 星体
  plutoU.uSunDir.value.copy(sunDir);plutoU.uSunInt.value=P.sunInt;plutoU.uHeart.value=P.heart;
  plutoU.uAmbCol.value.setRGB(0.045,0.035,0.075).lerp(new THREE.Color(0.07,0.04,0.045),P.warm*0.5+0.5).multiplyScalar(P.amb);
  plutoU.uRipR.value=hb.dt*0.95;plutoU.uRipA.value=Math.exp(-hb.dt*1.6)*sstep(0,0.05,hb.dt);
  pluto.getWorldQuaternion(tmpQ);plutoU.uRot.value.setFromMatrix4(tmpM4.makeRotationFromQuaternion(tmpQ));
  charon.getWorldQuaternion(tmpQ);charonU.uRot.value.setFromMatrix4(tmpM4.makeRotationFromQuaternion(tmpQ));
  atmU.uCenter.value.copy(pPos);atmU.uAtm.value=P.atm;
  // 粒子与特效
  motes.material.uniforms.uAmt.value=P.motes;motes.visible=P.motes>0.001;
  sublim.material.uniforms.uAmt.value=P.sublim;sublim.visible=P.sublim>0.001;
  wind.material.uniforms.uAmt.value=P.wind;wind.visible=P.wind>0.001;
  threadU.uAmt.value=P.thread;threadU.uDraw.value=P.threadDraw;thread.visible=threadP.visible=P.thread>0.001;
  dustU.uAmt.value=P.dust;dustU.uCollapse.value=P.collapse;dust.visible=P.dust>0.001;
  for(const c of [circC,circP]){c.material.uniforms.uDraw.value=P.circles;c.material.uniforms.uAmt.value=P.circles>0?1:0;c.visible=P.circles>0.001}
  meteorU.uAmt.value=P.meteor;meteors.visible=P.meteor>0.001;
  bokeh.material.uniforms.uAmt.value=P.bokeh;bokeh.visible=P.bokeh>0.001;
  // 心跳波
  let tide=0;
  waves.forEach((w,k)=>{const dt=hb.dt+k*1.5;const R=1+dt*4.2;const a=P.waves*Math.exp(-dt*0.55)*sstep(0,0.08,dt);w.scale.setScalar(R);w.material.uniforms.uA.value=a*0.9;w.visible=a>0.002;
    tide+=Math.exp(-Math.pow((R-7)/0.9,2))*a});
  charonU.uTide.value=tide*1.2+P.thread*0.05;
  // 信标
  beaconP.position.copy(pPos);beaconC.position.copy(cPos);
  beaconP.material.uniforms.uAmt.value=P.beacon*(0.55+0.9*G.uBeat.value);beaconC.material.uniforms.uAmt.value=P.beacon*0.55;
  beaconP.visible=beaconC.visible=P.beacon>0.001;
  // 迟来的光
  if(P.beam>=0&&P.beam<1){const s=pPos.clone().addScaledVector(sunDir,28),e=pPos.clone().addScaledVector(sunDir,1.02);const k=Math.pow(P.beam,1.6);
    const h=vl(s,e,k);beamU.uH.value.copy(h);beamU.uT.value.copy(h).addScaledVector(sunDir,9);beamU.uAmt.value=1;beam.visible=beamHead.visible=true;
    beamHead.position.copy(h);beamHead.material.uniforms.uAmt.value=1.6}else{beam.visible=beamHead.visible=false}
  // 后期
  renderPass.scene=isOrr?orrery:scene;
  const trailOn=P.trail>0.001;after.enabled=trailOn;after.uniforms.damp.value=(trailOn&&!afterWasOn)?0:P.trail;afterWasOn=trailOn;
  bloom.strength=P.bloom*0.55;
  const fu=finalPass.uniforms;fu.uTime.value=t;fu.uExposure.value=P.exposure;fu.uWarm.value=P.warm;fu.uScope.value=P.scope;fu.uFade.value=P.fade;
  fu.uFlash.value=P.flash;fu.uSunVis.value=sunVis;fu.uSat.value=P.sat*1.04;
  // 界面
  const lt=t-S.seg.start;
  if(started||qs.has('t'))showLyric(S.seg,lt);
  const sn=SECNAME[S.seg.sec];ui.sec.innerHTML=sn[0]?`${sn[0]}<b>${sn[1]}</b>`:'';ui.sec.style.opacity=(S.seg.sec==='intro'||S.seg.sec==='end')?0:1;
  ui.hud.style.opacity=P.scope>0.35?P.scope:0;
  ui.counter.style.opacity=P.counter?(lt>0.3&&lt<S.seg.dur-0.3?1:0):0;if(P.counter)ui.cn.textContent=Math.round(P.earthLaps);
  ui.title.style.opacity=(started&&S.seg.shot==='intro'&&S.u>0.32&&S.u<0.92)?1:0;
  ui.end.style.opacity=(S.seg.shot==='end'&&S.u>0.12)?1:0;
  ui.tm.textContent=fmt(t);if(document.activeElement!==ui.sk)ui.sk.value=t;
}

function frame(){
  requestAnimationFrame(frame);
  let t=clock.now();
  if(clock.playing&&t>=TOTAL){clock.pause();clock.base=TOTAL-0.001;t=clock.base;ui.ctl.classList.add('show')}
  if(clock.playing&&clock.useAudio)score.tick(t);
  if(!started&&!qs.has('t'))t=10.2;
  update(t);
  composer.render();
}
if(qs.has('t')){started=true;ui.start.classList.add('hide');clock.base=+qs.get('t')||0;if(qs.has('play'))clock.play()}
MV.bench=(t,n=10)=>{const gl=renderer.getContext();const px=new Uint8Array(4);update(t);composer.render();gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const t0=performance.now();for(let i=0;i<n;i++){update(t+i/60);composer.render();gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px)}return +((performance.now()-t0)/n).toFixed(1)};
requestAnimationFrame(frame);
</script>
